name: Release

# Build the `shirabe` binary (and, with `foreign-engine`, the FFI wrapper) for
# Linux / macOS / Windows and attach them to the GitHub Release created by the
# pushed tag. Vendor engine libraries for Firefox / Servo are published the
# same way under their own release tags (libshirabe_engine_firefox_* etc.).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: shirabe-x86_64-linux.tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: shirabe-aarch64-macos.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: shirabe-x86_64-windows.zip }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure the release tag is on master
        if: github.event_name == 'push' && !github.event.deleted
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Offline-friendly: do not pull Chrome for Testing during a release build.
      - name: Build (release)
        env:
          SHIRABE_SKIP_BROWSER_FETCH: "1"
        # No `--locked`: Cargo.lock is gitignored (library convention), so a
        # fresh checkout has none — `--locked` failed every release build.
        run: cargo build --release --features foreign-engine --target ${{ matrix.target }}

      - name: Stage (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage/shirabe
          cp target/${{ matrix.target }}/release/shirabe stage/shirabe/
          cp README.md LICENSE stage/shirabe/
          tar -czf ${{ matrix.archive }} -C stage shirabe
      - name: Stage (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir stage\shirabe
          copy target\${{ matrix.target }}\release\shirabe.exe stage\shirabe\
          copy README.md stage\shirabe\
          copy LICENSE stage\shirabe\
          7z a ${{ matrix.archive }} stage\shirabe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  release-notes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: celestia-island/celestia-devtools/.github/workflows/release-notes.yml@master
