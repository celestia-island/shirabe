name: Checks

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  check:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    env:
      # The browser backend fetch is exercised separately; keep the check job
      # offline-friendly.
      SHIRABE_SKIP_BROWSER_FETCH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
