name: npm Release

# Publish the `shirabe` binary to npm as precompiled platform subpackages so
# users can run it via `npx @celestia-island/shirabe` with no Rust toolchain.
#
# This pipeline is the npm counterpart to release.yml (which attaches release
# archives to the GitHub Release). It runs in two phases:
#
#   1. `build-subpackage` (matrix, one job per platform) — cross-compile the
#      binary, stage it into a platform subpackage via celestia-devtools
#      `npm-dist`, and publish that single subpackage to npm.
#   2. `publish-root` (single job, fan-in) — with no binary of its own, re-run
#      `npm-dist` to (re)assemble the root package listing every subpackage
#      already on npm, then publish the root launcher.
#
# The version is derived from the pushed tag (vX.Y.Z → X.Y.Z) and is shared by
# the root package and every subpackage so they are released in lockstep.
#
# The Linux lane is static musl for both CPU classes, published under the
# generic `-linux-x64` / `-linux-arm64` names: one artifact per CPU class with
# no glibc floor, so Debian/Ubuntu/Alpine/distroless hosts all run the same
# binary. Building on ubuntu-latest previously pinned a GLIBC 2.38/2.39 floor
# that older hosts could not satisfy. The macOS binaries stay native and
# Windows stays on MSVC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0), without leading v"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: Release tag provenance
    # A release tag must point at a squash-merged master commit (AGENTS [[change]]).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure the release tag is on master
        if: github.event_name == 'push' && !github.event.deleted
        shell: bash
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/master — release tags must point at a squash-merged master commit"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is on master"

  build-subpackage:
    needs: guard
    name: Build + publish @celestia-island/shirabe${{ matrix.suffix }} to npm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  platform: x86_64-unknown-linux-gnu,  suffix: -linux-x64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, platform: aarch64-unknown-linux-gnu, suffix: -linux-arm64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       platform: aarch64-apple-darwin,      suffix: -darwin-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,        platform: x86_64-apple-darwin,       suffix: -darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     platform: x86_64-pc-windows-msvc,    suffix: -win32-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing $v"

      # Static musl is the only Linux lane that does not pin a glibc floor:
      # zig supplies the cross linker for both x86_64 and aarch64 musl.
      - name: Install zig + cargo-zigbuild
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      # Offline-friendly: do not pull Chrome for Testing during a release build.
      # Build with the mcp feature so `shirabe mcp` ships in the binary.
      - name: Build (release, static musl)
        if: runner.os == 'Linux'
        env:
          SHIRABE_SKIP_BROWSER_FETCH: "1"
        run: cargo zigbuild --release --features mcp --target ${{ matrix.target }}

      - name: Build (release)
        if: runner.os != 'Linux'
        env:
          SHIRABE_SKIP_BROWSER_FETCH: "1"
        run: cargo build --release --features mcp --target ${{ matrix.target }}

      # Stage the platform subpackage. We publish it from this same job (one
      # subpackage per platform, directly from the runner that built it).
      - name: Stage subpackage
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/shirabe"
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && bin="${bin}.exe"
          # The Linux binary is built for musl but published under the generic
          # platform name: one static artifact per CPU class, no -musl twin and
          # no glibc variant. `platform` only selects the os/cpu/suffix mapping.
          celestia-devtools npm-dist \
            --name shirabe \
            --version "${{ steps.ver.outputs.version }}" \
            --binary "$bin" \
            --rust-target "${{ matrix.platform }}" \
            --out-dir dist \
            --description "Headless browser automation — CDP engine + HTTP debug API" \
            --repository "https://github.com/celestia-island/shirabe" \
            --homepage "https://github.com/celestia-island/shirabe"

      - name: Upload staged subpackage
        uses: actions/upload-artifact@v4
        with:
          name: subpackage-${{ matrix.suffix }}
          path: dist/shirabe${{ matrix.suffix }}
          retention-days: 7

      - name: Publish subpackage
        shell: bash
        run: |
          sub="dist/shirabe${{ matrix.suffix }}"
          echo "::group::npm pack $sub"
          (cd "$sub" && npm pack --dry-run)
          echo "::endgroup::"
          (cd "$sub" && npm publish --access public --provenance)

  publish-root:
    name: Publish root @celestia-island/shirabe to npm
    needs: [guard, build-subpackage]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # No binary here — this only (re)assembles the root package manifest
      # whose optionalDependencies enumerate the five subpackages already
      # published by build-subpackage. We pre-create those subpackage dirs as
      # empty stubs purely so npm-dist's discovery sees all five platforms;
      # the real bytes ship in the subpackages published in phase 1.
      - name: Assemble root package
        run: |
          for sfx in -linux-x64 -linux-arm64 -darwin-arm64 -darwin-x64 -win32-x64; do
            mkdir -p "dist/shirabe${sfx}"
          done
          celestia-devtools npm-dist \
            --name shirabe \
            --version "${{ steps.ver.outputs.version }}" \
            --out-dir dist \
            --description "Headless browser automation — CDP engine + HTTP debug API (npx launcher)" \
            --repository "https://github.com/celestia-island/shirabe" \
            --homepage "https://github.com/celestia-island/shirabe"

      - name: Publish root package
        run: |
          echo "::group::npm pack (root)"
          (cd dist && npm pack --dry-run)
          echo "::endgroup::"
          (cd dist && npm publish --access public --provenance)
